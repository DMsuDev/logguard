name: Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff format check (examples + logguard)
        run: |
          python -m ruff format --check examples/ logguard/

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff lint (examples + logguard)
        run: |
          python -m ruff check examples/ logguard/ --select E,F,W,I,UP,B,SIM,ANN,C4,RET,PL,RUF --ignore ANN101,ANN102

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: MyPy type check
        run: mypy logguard/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11, 3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (with coverage)
        run: pytest --cov=logguard --cov-report=term-missing

  ci:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test]
    if: ${{ always() }}
    steps:
      - name: Decide whether all tests passed
        run: ${{ !contains(needs.*.result, 'failure') }}
        if: needs.format.result == 'failure' || needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.test.result == 'failure'
      - name: All checks passed
        run: echo "All CI checks passed!"
        if: success()
