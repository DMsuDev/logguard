name: Validation (CI)

on:
  push:
    branches: [main]
    paths:
      - "logguard/**"
      - ".github/workflows/validation.yml"
  pull_request:
    paths:
      - "logguard/**"
      - ".github/workflows/validation.yml"
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Quality Checks (Lint + Format + Typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check logguard/ examples/ --output-format=github

      - name: Ruff format check
        run: ruff format --check logguard/ examples/

      - name: mypy type check
        run: mypy logguard/

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=logguard --cov-report=xml --cov-report=term-missing

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: always()
    steps:
      - name: Check if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "Some jobs failed!"
            exit 1
          else
            echo "All checks passed!"
            exit 0
          fi