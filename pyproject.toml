[project]
name = "logguard"
version = "0.1.1"
description = "Utilities for logging, assertions and custom exceptions"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "DMsuDev", email = "dayronmustelier13@gmail.com" },
]
keywords = ["logging", "assertions", "exceptions", "debugging", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
]

dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
json = [
    "python-json-logger>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "pdoc>=15.0,<16.0",
    "python-json-logger>=4.0",
]

[project.urls]
Homepage = "https://github.com/DMsuDev/logguard"
# Documentation = "https://logguard.readthedocs.io"   # Placeholder, update when docs are ready
Repository = "https://github.com/DMsuDev/logguard"
"Bug Tracker" = "https://github.com/DMsuDev/logguard/issues"

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["logguard"]

# =================================================================
# Ruff Configuration - Python Linter and Formatter
# =================================================================

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["logguard", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN", "C4", "RET", "PL", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]  # self/cls type hints and Any are optional
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"asserts.py" = ["PLR0913", "PLR0912", "PLW0603", "RUF022"]
"logger.py" = ["PLR0913", "PLR0915", "PLC0415"]
"examples/*.py" = ["PLR2004", "PLR0915", "E501", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["logguard"]

# =================================================================
# MyPy Configuration - Static Type Checking
# =================================================================

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
strict = false
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# =================================================================
# Pytest Configuration - Testing Framework
# =================================================================

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=logguard --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# =================================================================
# Coverage Configuration - Code Coverage Measurement
# =================================================================

[tool.coverage.run]
source = ["logguard"]
omit = ["*/__main__.py", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if sys.platform",
]
precision = 2
fail_under = 80 # Minimum coverage percentage to pass

[tool.coverage.html]
directory = "build/coverage_html"
